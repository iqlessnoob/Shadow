plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shadowbound.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shadowbound.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
